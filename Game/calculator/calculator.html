<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cce8ef">
  <title>Internship Cost Calculator</title>
  <link rel="stylesheet" href="calculator.css">
  <script src="calculator.js" defer></script>
</head>
<body style="margin:0;background:var(--pixel-bg)">
  <!-- Embed this section with the CSS and deferred JS. Add data-collapsed="true"
       to the mount for a collapsed story card. ?openCalculator=true#calculator expands it. -->
  <section id="calculator" aria-label="Internship cost calculator">
    <div id="internship-calculator"></div>
    <noscript>Please enable JavaScript to use the calculator.</noscript>
  </section>
</body>
</html>
